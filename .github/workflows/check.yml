name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: Run the full browser build on a self-hosted runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --print-build-logs
      - run: nix eval --raw .#br.pname | grep -Fx br
      - run: ./scripts/verify.sh --source .

  full-build:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: [self-hosted, linux, x64, br-big-build]
    timeout-minutes: 2880
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#br --print-build-logs
      - run: nix shell nixpkgs#desktop-file-utils -c ./scripts/verify.sh ./result
