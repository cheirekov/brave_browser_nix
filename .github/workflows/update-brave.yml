name: update Brave stable

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-brave-stable
  cancel-in-progress: false

jobs:
  update:
    name: check Stable, verify metadata, and upsert PR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        name: Check official Linux Stable channel
        run: ./scripts/update.sh --check
      - if: steps.check.outputs.update_available == 'true'
        id: update
        name: Regenerate and verify source metadata
        run: ./scripts/update.sh
      - if: steps.check.outputs.update_available == 'true'
        name: Test automation policy
        run: python3 -m unittest discover -s tests -v
      - if: steps.check.outputs.update_available == 'true'
        name: Create or update the guarded Stable PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.check.outputs.old_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: ./scripts/publish_update_pr.sh "$OLD_VERSION" "$NEW_VERSION"
